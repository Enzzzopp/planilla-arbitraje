<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Planilla de Gastos - Arbitraje</title>
<style>
:root{--ink:#14201A;--muted:#6B7A71;--line:#E3E8E4;--soft:#F3F6F4;--green:#2E9B5E;--green-d:#1F7A47;--green-s:#E6F4EC;--yellow:#FFE45C;--err:#C0392B;--errbg:#FDECEA}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7DB8F5;outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px calc(116px + env(safe-area-inset-bottom,0px))}

/* encabezado */
.hero{background:linear-gradient(180deg,#EEF7F1 0%,#fff 100%);border:1px solid var(--line);border-radius:22px;padding:14px 14px 16px;margin:0 0 14px;display:grid;gap:14px}
.logos{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.logos img{height:30px;width:auto;max-width:46%;object-fit:contain;display:block}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green-d)}
h1{margin:2px 0 0;font-size:25px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
.numbox{display:grid;gap:3px;background:var(--yellow);border-radius:16px;padding:8px 12px 8px;box-shadow:0 2px 0 rgba(0,0,0,.08);cursor:text}
.numbox>span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5c4f00}
.nv{display:flex;align-items:center;gap:8px}
.nv input{width:4.4ch;border:0;border-bottom:2px dashed rgba(0,0,0,.35);background:transparent;font-weight:800;font-size:26px;line-height:1.1;padding:0 0 1px;text-align:left;font-variant-numeric:tabular-nums;border-radius:0}
.nv input:focus{outline:none;border-bottom-color:#000}
.nv svg{width:18px;height:18px;flex:none;color:#5c4f00}

/* secciones desplegables */
.sec{border:1px solid var(--line);border-radius:18px;margin:0 0 10px;background:#fff;scroll-margin-top:10px;transition:border-color .2s,box-shadow .2s}
.sec.open{border-color:#cfd9d2;box-shadow:0 6px 22px rgba(20,32,26,.07)}
.sh{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:14px 14px}
.step{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--muted)}
.sec.done .step{background:var(--green);border-color:var(--green);color:#fff}
.sec.open:not(.done) .step{border-color:var(--green);color:var(--green-d)}
.st{flex:1;min-width:0;display:grid;gap:1px}
.st b{font-size:18px;font-weight:700}
.st small{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.done .st small{color:var(--green-d)}
.chev{flex:none;width:20px;height:20px;color:var(--muted);transition:transform .2s}
.sec.open .chev{transform:rotate(180deg)}
.sb{padding:2px 14px 16px;display:grid;gap:14px}

/* campos */
.f{display:grid;gap:6px;min-width:0}
.f>span{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;min-width:0;height:50px;border:1.5px solid transparent;background:var(--soft);border-radius:12px;padding:0 14px;font-size:17px}
.in:focus{outline:none;border-color:var(--green);background:#fff}
.in.bad{border-color:var(--err);background:var(--errbg)}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6B7A71 50%),linear-gradient(135deg,#6B7A71 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{margin:0;color:var(--err);font-size:14px;font-weight:600}
.hint{margin:0;color:var(--muted);font-size:14px}

/* contadores */
.ctr{display:inline-flex;align-items:center;gap:4px}
.ctr button{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;font-size:24px;line-height:1;padding:0}
.ctr button.plus{background:var(--green);color:#fff}
.ctr button:active{transform:scale(.93)}
.ctr b{min-width:30px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:#9AA7A0}
.ctr b.on{color:var(--ink)}
.ctr.sm button{width:34px;height:34px;font-size:20px}
.ctr.sm b{min-width:24px;font-size:18px}
.ctr.big button{width:52px;height:52px;font-size:30px}
.ctr.big b{min-width:84px;font-size:30px}

.cr{display:grid;grid-template-columns:minmax(0,1fr) 104px 104px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.cr:first-child{border-top:0}
.cr.hd{padding:0 0 4px;border:0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.cr .ctr{justify-self:center}
.cn{font-weight:700;font-size:18px}

.tr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr .n{min-width:0}
.tr .n b{display:block;font-size:17px}
.tr .n small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tr .x{width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.empty{margin:0;color:var(--muted);font-size:15px;padding:2px 0}
.man{background:var(--soft);border-radius:14px;padding:12px;display:grid;gap:10px}
.man .in{background:#fff;border-color:var(--line)}

.tot-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px;color:var(--muted)}
.tot-line b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.dl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.dl:first-of-type{border-top:0}
.dn{min-width:0}.dn b{display:block;font-size:18px}.dn small{display:block;color:var(--muted);font-size:13px;line-height:1.25}
.arow{display:flex;align-items:center;gap:8px}
.arow .in{flex:1}
.arow .x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:22px;line-height:1;display:grid;place-items:center;padding:0}

.btn{border:0;background:var(--soft);border-radius:14px;min-height:50px;padding:0 20px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.go{background:var(--green);color:#fff}
.btn.go:active{background:var(--green-d)}
.btn.full{width:100%}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.next{justify-self:end;background:var(--green-s);color:var(--green-d);min-height:44px;padding:0 18px;border-radius:12px}
.link{background:none;border:0;text-decoration:underline;font-size:16px;padding:10px;color:#3a4a41}

.nota{margin:4px 4px 0;text-align:center;font-size:12.5px;color:#8A978F}
/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 -8px 24px rgba(20,32,26,.06)}
.bar-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:14px}
.tot{flex:1;min-width:0}
.tot small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tot b{display:block;font-size:28px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .btn{min-width:150px}

/* vista previa */
.ov{position:fixed;inset:0;z-index:50;background:#EEF1EF;display:flex;flex-direction:column}
.ov-top{background:#fff;border-bottom:1px solid var(--line);padding:16px;font-weight:800;text-align:center;font-size:18px}
.ov-body{flex:1;overflow:auto;padding:16px}
.paper{max-width:520px;margin:0 auto;background:#fff;border-radius:6px;box-shadow:0 4px 18px rgba(20,32,26,.18)}
.paper canvas{display:block;width:100%;height:auto}
.ov-foot{background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.ov-foot-in{max-width:520px;margin:0 auto;display:grid;gap:6px}
.msg{margin:0;text-align:center;font-size:15px;color:var(--muted)}
.msg.ok{color:var(--green-d);font-weight:600}
@media (max-width:350px){.cr{grid-template-columns:minmax(0,1fr) 92px 92px}.ctr.sm button{width:30px;height:30px}.ctr.sm b{min-width:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="logos"><img id="logo1" alt="Asociación Neuquina de Árbitros de Basquetbol"><img id="logo2" alt="Federación de Básquetbol de Neuquén"></div>
    <div class="hero-row">
      <div><div class="eyebrow">Arbitraje</div><h1>Planilla de gastos</h1></div>
      <label class="numbox" for="num"><span>N° de planilla</span><span class="nv"><input id="num" inputmode="numeric" autocomplete="off" aria-label="Número de planilla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span></label>
    </div>
  </header>

  <section class="sec open" id="s1">
    <button class="sh" type="button" aria-expanded="true"><span class="step">1</span><span class="st"><b>Partido</b><small id="sum1"></small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="sb">
      <label class="f"><span>Fecha</span><input class="in" id="fecha" type="date"></label>
      <label class="f"><span>Ciudad</span><select class="in" id="ciudad"></select></label>
      <label class="f" id="ciudadOtraBox" hidden><span>Escribí la ciudad</span><input class="in" id="ciudadOtra" autocomplete="off" placeholder="Ciudad"></label>
      <p class="err" id="e-ciudad" hidden></p>
      <div class="two">
        <label class="f"><span>Equipo local</span><input class="in" id="local" autocomplete="off" placeholder="Centro Español"><p class="err" id="e-local" hidden></p></label>
        <label class="f"><span>Equipo visitante</span><input class="in" id="visita" autocomplete="off" placeholder="Zorros"><p class="err" id="e-visita" hidden></p></label>
      </div>
      <button class="btn next" type="button" data-next="s2">Siguiente</button>
    </div>
  </section>

  <section class="sec" id="s2">
    <button class="sh" type="button" aria-expanded="false"><span class="step">2</span><span class="st"><b>Traslado</b><small id="sum2"></small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="sb" hidden>
      <div id="trasRows"></div>
      <label class="f"><span>Agregar un traslado (ida y vuelta)</span><select class="in" id="trasAdd"></select></label>
      <div class="man" id="trasManual" hidden>
        <label class="f"><span>Destino</span><input class="in" id="trasOtraNom" autocomplete="off" placeholder="Ej.: Neuquén"></label>
        <label class="f"><span>Valor del pasaje ($)</span><input class="in" id="trasOtraVal" inputmode="numeric" autocomplete="off" placeholder="0"></label>
        <p class="err" id="e-tras" hidden></p>
        <button class="btn go" id="trasOtraOk" type="button">Agregar traslado</button>
      </div>
      <div class="tot-line"><span>Total traslado</span><b id="trasTot">$ 0</b></div>
      <button class="btn next" type="button" data-next="s3">Siguiente</button>
    </div>
  </section>

  <section class="sec" id="s3">
    <button class="sh" type="button" aria-expanded="false"><span class="step">3</span><span class="st"><b>Dieta</b><small id="sum3"></small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="sb" hidden>
      <div class="dl"><div class="dn"><b>Dieta</b><small id="dietaNote"></small></div><div id="dhCtr"></div></div>
      <div class="dl"><div class="dn"><b>Dieta Mayores</b><small id="dmNote"></small></div><div id="dmCtr"></div></div>
      <div class="tot-line"><span id="dietaDet">Total dieta</span><b id="dietaTot">$ 0</b></div>
      <button class="btn next" type="button" data-next="s4">Siguiente</button>
    </div>
  </section>

  <section class="sec" id="s4">
    <button class="sh" type="button" aria-expanded="false"><span class="step">4</span><span class="st"><b>Aranceles</b><small id="sum4"></small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="sb" hidden>
      <p class="hint">Tocá + por cada partido que arbitraste.</p>
      <div><div class="cr hd"><span></span><span>Masc.</span><span>Fem.</span></div><div id="catList"></div></div>
      <p class="err" id="e-arancel" hidden></p>
      <button class="btn next" type="button" data-next="s5">Siguiente</button>
    </div>
  </section>

  <section class="sec" id="s5">
    <button class="sh" type="button" aria-expanded="false"><span class="step">5</span><span class="st"><b>Árbitro</b><small id="sum5"></small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="sb" hidden>
      <label class="f"><span>Nombre y apellido</span><input class="in" id="arbitro" autocomplete="name" placeholder="Tu nombre"><p class="err" id="e-arbitro" hidden></p></label>
      <div id="arbsExtra" style="display:grid;gap:10px"></div>
      <button class="btn ghost" id="arbAdd" type="button">+ Agregar otro árbitro</button>
      <p class="hint">Cada árbitro suma su línea de firma en la planilla. Tu nombre se guarda para la próxima vez.</p>
    </div>
  </section>
  <p class="nota" id="valoresNota"></p>
</div>

<div class="bar"><div class="bar-in">
  <div class="tot"><small>Total</small><b id="total">$ 0</b></div>
  <button class="btn go" id="crear" type="button">Crear PDF</button>
</div></div>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="ov-top" id="ovTitle">Revisá la planilla</div>
  <div class="ov-body"><div class="paper"><canvas id="cv"></canvas></div></div>
  <div class="ov-foot"><div class="ov-foot-in">
    <p class="msg" id="msg" hidden></p>
    <div id="acts"></div>
  </div></div>
</div>

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const int=v=>{const n=parseInt(String(v==null?'':v).replace(/\D/g,''),10);return isNaN(n)?0:n};
const pad4=n=>String(int(n)).padStart(4,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtFecha=iso=>{const p=String(iso||'').split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:''};
function money(n,dec=2){n=Number(n)||0;const neg=n<0;n=Math.abs(n);let [i,d]=n.toFixed(dec).split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'-':'')+i+(dec?','+d:'')}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const UN=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const DEC=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const CEN=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function n999(n){if(!n)return '';if(n===100)return 'cien';const c=Math.floor(n/100),r=n%100;let t='';
  if(r<30)t=UN[r];else{t=DEC[Math.floor(r/10)];if(r%10)t+=' y '+UN[r%10]}
  return [CEN[c],t].filter(Boolean).join(' ')}
const apoc=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
function enLetras(n){n=Math.floor(Math.abs(n));if(n===0)return 'cero';
  const mill=Math.floor(n/1e6),miles=Math.floor((n%1e6)/1000),resto=n%1000,p=[];
  if(mill)p.push(mill===1?'un millón':apoc(enLetras(mill))+' millones');
  if(miles)p.push(miles===1?'mil':apoc(n999(miles))+' mil');
  if(resto)p.push(n999(resto));
  return p.join(' ')}
const sonPesos=t=>{const w=enLetras(Math.floor(t+1e-9));return w.charAt(0).toUpperCase()+w.slice(1)};

/* ---------- estado ---------- */
const blankCats=()=>{const o={};CATS.forEach(c=>o[c.k]=[0,0]);return o};
const settings=store.get('pa2.cfg',{nextNum:1,arbitro:'',ciudad:''});
let D=store.get('pa2.draft',null);
if(!D||typeof D!=='object')D=null;
function freshDraft(){return {num:settings.nextNum||1,fecha:todayISO(),ciudad:'',otra:false,local:'',visita:'',tras:[],dh:0,dm:0,arbs:[],cat:blankCats()}}
D=Object.assign(freshDraft(),D||{});if(D.dieta!=null||D.media!=null){D.dh=int(D.dh)||(int(D.dieta)*2+int(D.media));delete D.dieta;delete D.media}D.cat=Object.assign(blankCats(),D.cat||{});if(!Array.isArray(D.tras))D.tras=[];if(!Array.isArray(D.arbs))D.arbs=[];D.dm=int(D.dm);
if(!D.fecha)D.fecha=todayISO();

function periodo(fecha){let p=TARIFAS[0];for(const x of TARIFAS){if(x.desde<=(fecha||''))p=x}return p}
const mitades=h=>{const w=Math.floor(h/2),m=h%2;return w&&m?`${w} y ½`:w?`${w}`:m?'½':''};
const parte=(l,n)=>n===1?l:`${l} x ${n}`;
function calc(d){
  const per=periodo(d.fecha);
  const may=d.cat.MAY[0]+d.cat.MAY[1],maxi=d.cat.MAXI[0]+d.cat.MAXI[1];
  const otros=['U11','U13','U15','U17','U21'].reduce((a,k)=>a+d.cat[k][0]+d.cat[k][1],0);
  const dv=per.dieta,dmv=per.dietaMay;
  let ar=0;
  const cats=CATS.map(c=>{const [m,f]=d.cat[c.k];const [pm,pf]=per.cat[c.k]||[0,0];const amt=m*pm+f*pf;ar+=amt;
    const det=[m&&parte('Masculino',m),f&&parte('Femenino',f)].filter(Boolean).join(' y ');return {...c,m,f,pm,pf,amt,det}});
  const halves=int(d.dh),dm=int(d.dm);
  const dietaAmt=Math.round(dv*halves/2)+dm*dmv;
  const dietaDet=[halves?`${dv} x ${mitades(halves)}`:'',dm?`${dmv} x ${dm}`:''].filter(Boolean).join(' + ');
  const L=Array.isArray(d.tras)?d.tras:[];
  const tras=L.reduce((a,l)=>a+int(l.v)*int(l.n),0),trasDet=L.filter(l=>int(l.n)>0).map(l=>`${int(l.v)} x ${int(l.n)}`).join(' + ');
  return {per,cats,ar,dv,dmv,dietaAmt,dietaDet,tras,trasDet,total:tras+dietaAmt+ar}
}

const SECOF={ciudad:'s1',local:'s1',visita:'s1',arancel:'s4',arbitro:'s5'};
function clearErr(k){(k?[k]:['ciudad','local','visita','arbitro','arancel']).forEach(x=>{const e=$('#e-'+x);if(e)e.hidden=true;const i=$('#'+x);if(i&&i.classList)i.classList.remove('bad')})}
function showErr(k,msg){const e=$('#e-'+k);e.textContent=msg;e.hidden=false;const i=$('#'+k);if(i&&i.classList)i.classList.add('bad');
  openSec(SECOF[k]);setTimeout(()=>{(i||e).scrollIntoView({behavior:'smooth',block:'center'});if(i&&i.tagName==='INPUT'){try{i.focus({preventScroll:true})}catch(_){}}},80)}
function validar(){const C=calc(D);clearErr();
  if(!D.ciudad.trim()){showErr('ciudad',D.otra?'Escribí la ciudad donde fue el partido.':'Elegí la ciudad donde fue el partido.');return false}
  if(!D.local.trim()){showErr('local','Escribí el equipo local.');return false}
  if(!D.visita.trim()){showErr('visita','Escribí el equipo visitante.');return false}
  if(C.ar<=0){showErr('arancel','Falta cargar los aranceles: tocá + en la categoría que arbitraste.');return false}

/* ---------- dibujo de la planilla (mm, A4) ---------- */
const PT=0.352778;
const hexRGB=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const imgCache=new Map();
function loadImgs(){return Promise.all([LOGO1,LOGO2].map(l=>new Promise(res=>{const im=new Image();im.onload=()=>res();im.onerror=()=>res();im.src=l.src;imgCache.set(l.src,im)})))}
function pdfRenderer(doc){return {
  font(st,pt,fam){doc.setFont(fam==='s'?'helvetica':'times',st);doc.setFontSize(pt)},
  color(c){doc.setTextColor(...hexRGB(c))},
  text(t,x,y,al){doc.text(String(t),x,y,{align:al||'left'})},
  width(t){return doc.getTextWidth(String(t))},
  line(x1,y1,x2,y2,w,dash,col){doc.setLineWidth(w);doc.setDrawColor(...hexRGB(col||'#000000'));doc.setLineDashPattern(dash||[],0);doc.line(x1,y1,x2,y2);doc.setLineDashPattern([],0)},
  rect(x,y,w,h,lw){doc.setLineWidth(lw);doc.setDrawColor(0,0,0);doc.setLineDashPattern([],0);doc.rect(x,y,w,h,'S')},
  image(lg,x,y,w,h){try{doc.addImage(lg.src,'PNG',x,y,w,h,undefined,'FAST')}catch(e){}}}}
function canvasRenderer(ctx,s,dry){let cur={st:'normal',pt:10};
  const setF=()=>{const b=cur.st.includes('bold')?'700':'400',i=cur.st.includes('italic')?'italic ':'';ctx.font=`${i}${b} ${(cur.pt*PT*s).toFixed(2)}px ${cur.fam==='s'?'Helvetica, Arial, "Liberation Sans", sans-serif':'"Times New Roman", "Liberation Serif", Times, serif'}`};
  return {
  font(st,pt,fam){cur={st,pt,fam};setF()},
  color(c){ctx.fillStyle=c},
  text(t,x,y,al){if(dry)return;ctx.textAlign=al||'left';ctx.textBaseline='alphabetic';ctx.fillText(String(t),x*s,y*s)},
  width(t){return ctx.measureText(String(t)).width/s},
  line(x1,y1,x2,y2,w,dash,col){if(dry)return;ctx.beginPath();ctx.lineWidth=Math.max(w*s,.6);ctx.strokeStyle=col||'#000';ctx.setLineDash(dash?dash.map(v=>v*s):[]);ctx.moveTo(x1*s,y1*s);ctx.lineTo(x2*s,y2*s);ctx.stroke();ctx.setLineDash([])},
  rect(x,y,w,h,lw){if(dry)return;ctx.beginPath();ctx.setLineDash([]);ctx.lineWidth=Math.max(lw*s,.6);ctx.strokeStyle='#000';ctx.strokeRect(x*s,y*s,w*s,h*s)},
  image(lg,x,y,w,h){if(dry)return;const im=imgCache.get(lg.src);if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,x*s,y*s,w*s,h*s)}}}
function wrapT(R,text,maxW){const words=String(text).split(/\s+/).filter(Boolean),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(R.width(t)<=maxW||!cur)cur=t;else{lines.push(cur);cur=w}}if(cur)lines.push(cur);return lines}
function fit(R,text,maxW,st,pt,minPt){let p=pt;R.font(st,p);while(R.width(text)>maxW&&p>minPt){p-=.5;R.font(st,p)}
  if(R.width(text)<=maxW)return text;let t=String(text);while(t.length>1&&R.width(t+'...')>maxW)t=t.slice(0,-1);return t+'...'}

function drawPlanilla(R,P){
  const INK='#111111',GREY='#444444',DOT='#555555';
  const BX=14,BY=14,BW=182,x0=BX+10,x1=BX+BW-10,W=x1-x0,cx=x0+W/2,xa=x1-38;
  let y=BY+7;R.color(INK);
  // encabezado: logos + N°
  R.font('bolditalic',12,'s');const numTxt='N°  '+pad4(P.num),numW=R.width(numTxt);
  [LOGO1,LOGO2].forEach((lg,i)=>{const asp=lg.w/lg.h,h=12.5;let w=h*asp;const max=x1-numW-8-x0;if(w>max){w=max}const hh=w/asp;R.image(lg,x0,y+(h-hh)/2,w,hh);
    if(i===0){R.font('bolditalic',12,'s');R.text(numTxt,x1,y+h/2+1.5,'right')}y+=h+3});
  y+=6;
  // título
  R.font('bold',13.5);R.text('PLANILLA DE GASTOS',cx,y,'center');let tw=R.width('PLANILLA DE GASTOS');R.line(cx-tw/2,y+1,cx+tw/2,y+1,.3);
  y+=4;
  // fecha / ciudad
  R.rect(x0,y,W,7.5,.3);R.font('normal',9.5);R.color(GREY);R.text('FECHA:',x0+2,y+5);R.text('CIUDAD:',x0+W*.60,y+5);
  R.color(INK);R.font('normal',11);R.text(fmtFecha(P.fecha),x0+W*.2,y+5);
  const cxv=x0+W*.60+R.width('CIUDAD:')+0;R.font('normal',9.5);const cw=R.width('CIUDAD:');
  R.font('normal',11);R.text(fit(R,P.ciudad||'',x1-2-(x0+W*.60+cw+4),'normal',11,7),x0+W*.60+cw+4,y+5);
  y+=7.5+7;
  R.font('bold',11.5);R.text('GASTOS GENERALES',cx,y,'center');tw=R.width('GASTOS GENERALES');R.line(cx-tw/2,y+1,cx+tw/2,y+1,.3);
  y+=3;
  // partido: local VS visitante
  R.rect(x0,y,W,7.5,.3);R.color(GREY);R.font('normal',9.5);R.text('PARTIDO:',x0+2,y+5);R.color(INK);
  const vsx=x0+W*.64,lx=x0+W*.2;
  R.text(fit(R,P.local||'',vsx-6-lx,'normal',11,7),lx,y+5);
  R.font('normal',9.5);R.text('VS',vsx,y+5,'center');
  R.text(fit(R,P.visita||'',x1-2-(vsx+7),'normal',11,7),vsx+7,y+5);
  y+=7.5+4;
  // tabla de gastos
  const tTop=y;y+=6.6;const xd=x0+42,xm=(xd+xa-3)/2;
  const row=(label,mid,amt,o={})=>{
    R.color(INK);
    if(o.head){R.font('bold',10.5);R.text(label,x0+3,y);const w=R.width(label);R.line(x0+3,y+.9,x0+3+w,y+.9,.3);y+=8;return}
    R.font('normal',10.5);R.text(label,x0+3,y);
    R.line(xd,y+1.4,xa-3,y+1.4,.3,[.3,.9],DOT);
    if(mid){R.color('#222222');R.text(fit(R,mid,xa-6-xd,'normal',10.5,6.5),xm,y-.1,'center');R.color(INK)}
    R.rect(xa,y-4.1,x1-xa,5.5,.35);R.font('normal',10.5);R.text('$',xa+2,y);R.text(amt>0?money(amt):'-',x1-2.5,y,'right');
    y+=5.9};
  row('TRASLADO',P.C.trasDet,P.C.tras);
  row('DIETA',P.C.dietaDet,P.C.dietaAmt);
  y+=1.5;row('ARANCELES','',0,{head:true});
  P.C.cats.forEach(c=>{if(c.optional&&!c.amt)return;row(c.pdf,c.det||'---',c.amt)});
  y+=2;R.rect(x0,tTop,W,y-tTop,.3);
  // total
  y+=10;R.font('bold',11.5);R.text('TOTAL :',xa-4,y,'right');
  R.rect(xa,y-5.2,x1-xa,7.4,.4);R.font('normal',11.5);R.text('$',xa+2,y);R.text(money(P.C.total),x1-2.5,y,'right');
  // son pesos
  y+=11;R.font('normal',10.5);R.text('Son Pesos:',x0+8,y);
  const sx=x0+30;R.font('normal',10.5);let ls=wrapT(R,P.words,x1-sx-1);
  if(ls.length>2){R.font('normal',9);ls=wrapT(R,P.words,x1-sx-1).slice(0,3)}
  R.line(sx-1,y+1.5,x1,y+1.5,.3,[.3,.9],DOT);
  ls.forEach((l,i)=>{if(i){y+=6;R.line(sx-1,y+1.5,x1,y+1.5,.3,[.3,.9],DOT)}R.text(l,sx,y)});
  if(ls.length<2){y+=6;R.line(sx-1,y+1.5,x1,y+1.5,.3,[.3,.9],DOT)}
  // firmas: presidente + todos los árbitros
  const items=[{name:'',l1:'FIRMA Y ACLARACIÓN',l2:'PRESIDENTE DEL CLUB'},...P.arbs.map(n=>({name:n,l1:'FIRMA Y ACLARACIÓN DEL',l2:'ÁRBITRO'}))];
  const ncol=items.length<=4?2:items.length<=9?3:4,nrow=Math.ceil(items.length/ncol);
  const space=nrow<=2?22:nrow<=3?15:12,colW=W/ncol,lw=Math.min(60,colW-6),small=ncol>=4;
  for(let r=0;r<nrow;r++){
    y+=space;
    items.slice(r*ncol,r*ncol+ncol).forEach((f,i)=>{const c=x0+colW*(i+.5);
      R.line(c-lw/2,y,c+lw/2,y,.3);let yy=y+4.4;
      if(f.name&&f.name.trim()){R.font('bold',small?7.5:9.5);R.text(fit(R,f.name.trim(),lw+2,'bold',small?7.5:9.5,6),c,yy,'center');yy+=4}
      R.font('normal',small?6.5:8.5);R.color(GREY);R.text(f.l1,c,yy,'center');R.text(f.l2,c,yy+3.4,'center');R.color(INK)});
    y+=4.4+4+3.4+2}
  y+=6;
  R.rect(BX,BY,BW,y-BY,.5);
  return y}
const prep=d=>{const C=calc(d);return {num:d.num,fecha:d.fecha,ciudad:d.ciudad.trim(),local:d.local.trim(),visita:d.visita.trim(),C,words:sonPesos(C.total),arbs:[settings.arbitro,...D_arbs(d)].map(x=>String(x||'').trim()).filter(Boolean)}};
function D_arbs(d){return Array.isArray(d.arbs)?d.arbs:[]}
function buildPdf(d){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  doc.setProperties({title:'Planilla de gastos N° '+pad4(d.num),creator:'Planilla de Gastos - Arbitraje'});
  drawPlanilla(pdfRenderer(doc),prep(d));return doc.output('blob')}
function fileName(d){const p=`${d.local||''} vs ${d.visita||''}`.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);
  return `Planilla_${pad4(d.num)}_${d.fecha}${p?'_'+p:''}.pdf`}
function drawPreview(){const cv=$('#cv'),box=cv.parentElement,cssW=box.clientWidth||340,dpr=Math.min(window.devicePixelRatio||1,3),s=cssW/210,ctx=cv.getContext('2d');
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(297*s*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const P=prep(D);const h=drawPlanilla(canvasRenderer(ctx,s,true),P)+12;
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(h*s*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cssW,h*s);drawPlanilla(canvasRenderer(ctx,s,false),P)}

/* ---------- entrega del PDF ---------- */
let pdfBlob=null,pdfName='';
function puedeCompartir(){try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.pdf',{type:'application/pdf'})]}))}catch(e){return false}}
function descargar(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)}
function acts(html){$('#acts').innerHTML=html}
function msg(t,ok){const m=$('#msg');m.hidden=!t;m.textContent=t||'';m.classList.toggle('ok',!!ok)}
function abrirVista(){
  if(!window.jspdf){alert('No se pudo cargar el generador de PDF. Volvé a abrir el archivo.');return}
  $('#ov').hidden=false;document.body.style.overflow='hidden';msg('');
  const share=puedeCompartir();
  acts(`<div style="display:grid;gap:8px"><button class="btn go full" id="enviar" type="button">${share?'Enviar PDF (WhatsApp, etc.)':'Descargar PDF'}</button>`+
       `${share?'<button class="link" id="solo" type="button">Solo guardar en el teléfono</button>':''}<button class="link" id="volver" type="button">← Volver y corregir</button></div>`);
  $('#enviar').onclick=()=>entregar(share?'share':'dl');
  if($('#solo'))$('#solo').onclick=()=>entregar('dl');
  $('#volver').onclick=cerrarVista;
  loadImgs().then(()=>requestAnimationFrame(drawPreview));
}
function cerrarVista(){$('#ov').hidden=true;document.body.style.overflow=''}
async function entregar(modo){
  try{
    pdfName=fileName(D);pdfBlob=buildPdf(D);
    let res='dl';
    if(modo==='share'){const file=new File([pdfBlob],pdfName,{type:'application/pdf'});
      try{await navigator.share({files:[file],title:pdfName});res='share'}catch(e){if(e&&e.name==='AbortError')return;descargar(pdfBlob,pdfName);res='dl'}}
    else descargar(pdfBlob,pdfName);
    listo(res)
  }catch(e){msg('No se pudo crear el PDF. Probá de nuevo.')}
}
function listo(res){
  settings.nextNum=Math.max(int(settings.nextNum),int(D.num)+1);settings.ciudad=D.ciudad.trim();store.set('pa2.cfg',settings);
  $('#ovTitle').textContent='Planilla N° '+pad4(D.num)+' lista';
  msg(res==='share'?'Listo. Si no la mandaste, tocá "Enviar de nuevo".':'Listo. El PDF quedó en la carpeta Descargas del teléfono. Abrí WhatsApp y adjuntalo como documento.',true);
  acts(`<div style="display:grid;gap:8px"><button class="btn go full" id="nueva" type="button">Hacer otra planilla</button><button class="link" id="otra" type="button">${res==='share'?'Enviar de nuevo':'Descargar de nuevo'}</button></div>`);
  $('#nueva').onclick=nueva;$('#otra').onclick=()=>{if(res==='share'){const f=new File([pdfBlob],pdfName,{type:'application/pdf'});navigator.share({files:[f],title:pdfName}).catch(()=>{})}else descargar(pdfBlob,pdfName)}
}
function nueva(){cerrarVista();$('#ovTitle').textContent='Revisá la planilla';D=freshDraft();store.set('pa2.draft',D);fill();refresh();openSec('s1');window.scrollTo({top:0})}
$('#crear').addEventListener('click',()=>{if(validar())abrirVista()});
window.addEventListener('resize',()=>{if(!$('#ov').hidden&&!pdfBlob)drawPreview();else if(!$('#ov').hidden)drawPreview()});

/* ---------- valores compartidos (valores.json, editable desde admin.html) ---------- */
const VALORES_URL='valores.json';
function validar_v(v){return v&&Array.isArray(v.tarifas)&&v.tarifas.length&&Array.isArray(v.traslados)&&v.traslados.length}
function aplicarValores(){fillSelects();syncCiudad();refresh()}
async function cargarValores(){
  const nota=$('#valoresNota');
  const R=store.get('pa2.remote',{});
  if(Array.isArray(R.tar)&&R.tar.length&&Array.isArray(R.tras)&&R.tras.length){TARIFAS=R.tar;TRASLADOS=R.tras;aplicarValores()}
  if(!/^https?:/.test(location.protocol)){nota.textContent='';return}
  try{
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),9000);
    const r=await fetch(VALORES_URL+'?t='+Date.now(),{cache:'no-store',signal:ac.signal});clearTimeout(t);
    if(!r.ok)throw 0;const v=await r.json();if(!validar_v(v))throw 0;
    TARIFAS=v.tarifas.slice().sort((a,b)=>a.desde.localeCompare(b.desde));TRASLADOS=v.traslados;
    R.tar=TARIFAS;R.tras=TRASLADOS;R.at=Date.now();store.set('pa2.remote',R);aplicarValores();
    const d=new Date(R.at);nota.textContent=`Valores actualizados ${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }catch(e){nota.textContent=R.at?'Sin conexión: se usan los últimos valores guardados.':'Sin conexión: se usan los valores incluidos en la app.'}
}
/* ---------- inicio ---------- */
$('#logo1').src=LOGO1.src;$('#logo2').src=LOGO2.src;
build();fill();refresh();openSec('s1');cargarValores();
